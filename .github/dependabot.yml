# Weekly update PRs (CI must pass before merging; nothing auto-merges).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: "/.claude/skills/animated-shorts-kit/code"
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: "/"
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
