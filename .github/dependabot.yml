# One grouped PR per ecosystem per month, minor/patch only, so PRs never fight each other over lockfiles and
# Remotion packages always move together. Merge only when Checks is green; nothing auto-merges.
# Python is left out on purpose: CI's pip-audit fails the build if a pinned/installed package has a known hole.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: {interval: monthly}
    open-pull-requests-limit: 1
    groups:
      actions: {patterns: ["*"]}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/.claude/skills/animated-shorts-kit/code"
    schedule: {interval: monthly}
    open-pull-requests-limit: 1
    groups:
      npm: {patterns: ["*"]}
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
