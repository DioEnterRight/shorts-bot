name: Make video

on:
  schedule:
    - cron: "33 22 * * *"   # every day ~04:03 India time (GitHub may run it a few minutes late)
  workflow_dispatch:
    inputs:
      test:
        description: "Test mode: no keys used, nothing posted, just shows you a sample video (untick to make real videos)"
        type: boolean
        default: true
      language:
        description: "Language (auto = the learned English/Hindi split)"
        type: choice
        default: auto
        options: [auto, en, hi]

concurrency:
  group: shorts-bot
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # cartoon3d: Claude ~20-45 min + CPU render ~30-60 min; toon2d ~5-10 min
    env:
      GH_TOKEN: ${{ github.token }}
      TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
      CHROME: /usr/bin/google-chrome   # cartoon3d renders with the runner's Chrome (software WebGL)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install ffmpeg + skia system libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgl1   # skia (toon2d) needs EGL/GL

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-int8

      - name: Install Python packages + voice model
        run: |
          pip install -q -r requirements.txt
          python -m pipeline.fetch_models

      - name: Install Playwright (cartoon3d renderer)
        run: npm install -g playwright@1

      - name: Install Claude Code
        if: env.TEST != 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Collect stats from Instagram / YouTube
        if: env.TEST != 'true'
        continue-on-error: true
        env:
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m pipeline.analytics

      - name: Make the video
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LANGUAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.language || 'auto' }}
        run: |
          ARGS=""
          if [ "$LANGUAGE" != "auto" ]; then ARGS="--language $LANGUAGE"; fi
          if [ "$TEST" = "true" ]; then
            python -m pipeline.produce --test $ARGS
          else
            python -m pipeline.produce --release $ARGS
          fi

      - name: Show me the test video
        if: env.TEST == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-video
          path: out/*/final.mp4
          retention-days: 3

      - name: Save memory (history, stats, ideas, playbook)
        if: always() && env.TEST != 'true'
        run: |
          tools/save_state.sh "bot: data $(date -u +%F)"
