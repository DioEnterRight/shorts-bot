name: Make video

on:
  schedule:
    - cron: "13 * * * *"   # every hour: keeps the next uploads ready (config.yaml schedule)
  workflow_dispatch:
    inputs:
      test:
        description: "Test mode: no keys used, nothing posted, just shows you a sample video (untick to make real videos)"
        type: boolean
        default: true
      language:
        description: "Language (auto = the learned English/Hindi split)"
        type: choice
        default: auto
        options: [auto, en, hi]

concurrency:
  group: shorts-make         # one Make at a time; posting has its own queue, so a long render never blocks a post
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  gate:   # cheap: is a video needed for the next upload slots? (most hourly runs stop here in seconds)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      make: ${{ github.event_name == 'workflow_dispatch' || steps.gate.outputs.make == 'true' }}
      stats: ${{ github.event_name == 'workflow_dispatch' || steps.gate.outputs.stats == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - id: gate
        if: github.event_name != 'workflow_dispatch'
        run: pip install -q pyyaml && python -m pipeline.schedule make

  make:
    needs: gate
    if: needs.gate.outputs.make == 'true' || needs.gate.outputs.stats == 'true'
    runs-on: ubuntu-24.04   # pinned: ffmpeg 6.1.1 here = the ffmpeg our tests run on (ubuntu-latest moved the toolchain under us)
    timeout-minutes: 120   # one video per run: Claude ~5 min + kit checks + render ~20-40 min
    env:
      GH_TOKEN: ${{ github.token }}
      TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
      CHROME: /usr/bin/google-chrome   # the kit studio renders with the runner's Chrome (software WebGL)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: .claude/skills/animated-shorts-kit/code/package-lock.json

      - name: Install ffmpeg + skia system libraries
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgl1   # skia (toon2d) needs EGL/GL

      - name: Cache voice model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models
          key: kokoro-v1.0-int8

      - name: Install Python packages + voice model
        run: |
          pip install -q -r requirements.txt
          python -m pipeline.fetch_models

      - name: Install the kit studio (Remotion + Three.js)
        run: npm ci --no-audit --no-fund
        working-directory: .claude/skills/animated-shorts-kit/code

      - name: Install Claude Code
        if: env.TEST != 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.332   # pinned; update deliberately

      - name: Collect stats from Instagram / YouTube
        if: env.TEST != 'true' && needs.gate.outputs.stats == 'true'   # once a day (04-05 IST) is plenty
        continue-on-error: true
        env:
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m pipeline.analytics

      - name: Start FreeLLMAPI inside this job (free director + judge)
        if: env.TEST != 'true'
        env:
          FREELLMAPI_KEYS: ${{ secrets.FREELLMAPI_KEYS }}
        run: bash tools/start_freellmapi.sh

      - name: Make the video
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LANGUAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.language || 'auto' }}
        run: |
          ARGS=""
          if [ "$LANGUAGE" != "auto" ]; then ARGS="--language $LANGUAGE"; fi
          if [ "$TEST" = "true" ]; then
            python -m pipeline.produce --test $ARGS
          else
            python -m pipeline.produce --release $ARGS
          fi

      - name: Show me the test video
        if: env.TEST == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-video
          path: out/*/final.mp4
          retention-days: 3

      - name: Contact sheets of every version (you are the final judge)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: versions
          path: |
            out/*/versions/*/sheet_*.jpg
            out/*/versions/*/*.json
            out/*/versions/*/*.txt
            out/*/versions/*/rounds/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Save memory (history, stats, ideas, playbook)
        if: always() && env.TEST != 'true'
        run: |
          tools/save_state.sh "bot: data $(date -u +%F)"
