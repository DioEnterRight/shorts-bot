name: Throw away ready videos

on:
  workflow_dispatch: {}

concurrency:
  group: shorts-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml
      - run: python -m pipeline.clear_queue
      - name: Save memory
        if: always()
        run: |
          tools/save_state.sh "bot: cleared queue $(date -u +%F)"
