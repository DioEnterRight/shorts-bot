name: Throw away ready videos

on:
  workflow_dispatch: {}

concurrency:
  group: shorts-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml
      - run: python -m pipeline.clear_queue
      - name: Save memory
        if: always()
        run: |
          tools/save_state.sh "bot: cleared queue $(date -u +%F)"
