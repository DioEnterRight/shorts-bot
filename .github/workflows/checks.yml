name: Checks

# Regression + security checks. Read-only token, no secrets: safe for pull requests.
on:
  push:
    paths-ignore: ["data/**"]   # the bot's own state commits do not need a test run
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgl1   # skia (toon2d tests) needs EGL/GL
      - run: pip install -q -r requirements.txt pytest==9.2.0 pyflakes==4.1.0 pip-audit==2.10.1
      - run: python -m pyflakes pipeline tools tests
      - run: python -m pytest -q
      - name: Dependency audit (Python)
        run: pip-audit -r requirements.txt --progress-spinner off

  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # No standalone typecheck: the kit resolves `@story/*` per video project, so tsc only works inside a render.
      - name: Dependency audit (Node, production deps)
        working-directory: .claude/skills/animated-shorts-kit/code
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read     # gitleaks lists a pull request's commits
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
