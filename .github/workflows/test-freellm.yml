name: Test FreeLLMAPI

# Manual only. Starts FreeLLMAPI from your FREELLMAPI_KEYS secret, lists the models that are ready and sends ONE tiny
# request through the same chain the video uses (freellm.models in config.yaml). Makes no video, posts nothing, saves nothing.
on:
  workflow_dispatch: {}

concurrency:
  group: shorts-freellm-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pyyaml

      - name: Start FreeLLMAPI inside this job
        env:
          FREELLMAPI_KEYS: ${{ secrets.FREELLMAPI_KEYS }}
        run: |
          if [ -z "$FREELLMAPI_KEYS" ]; then echo "::error::Add the FREELLMAPI_KEYS secret first (FREELLM_SETUP.md step 2)"; exit 1; fi
          bash tools/start_freellmapi.sh

      - name: Check the keys and the model chain
        run: python -m pipeline.freellm --check
