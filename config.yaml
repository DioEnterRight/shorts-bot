# ============================================================
#  SHORTS BOT SETTINGS  —  the only file you normally edit
# ============================================================

# Emergency stop. Set to true and nothing gets made or posted.
paused: false

channel:
  # What the channel is about. Claude picks daily ideas inside this space.
  # Topic menu (ReachMora idea strategy: high-earning, bingeable niches with drawable cause and effect).
  # Claude mixes these across its pitches. Delete a line to drop that niche.
  niche: |-
    Cons & Coins: scams, heists, money and the psychology behind them, as curious, slightly dark, funny cartoon stories and explainers.
    - Money stories, scams and cons (rise, trick, twist)
    - Business rise and fall (one decision that made or broke a company)
    - Psychology and human behaviour (why people do strange things)
    - Self-improvement and life lessons (one habit or rule, shown in a story)
    - How money really works (inflation, banks, debt, prices, explained simply)
    - Weird history and mysteries (strange events, odd laws, lucky accidents)
    - Light true crime (heists, frauds, escapes; nothing graphic)

video:                    # vertical 1080x1920, 30 fps
  target_seconds: 55      # animated-shorts-kit story formula: 45-65 s
  fps: 30

# ------------------------------------------------------------
#  BRAND — "@outrichguy" in the top-right corner of every frame; the last ~3 s: the main character says the follow
#  line to camera while a FOLLOW card shows the channel name and the handle (pipeline/branding.py)
# ------------------------------------------------------------
brand:
  corner_handle: "@outrichguy"
  channel_name: "Cons & Coins"
  outro_seconds: 3
  outro:
    en: {caption: "Follow Cons & Coins and @outrichguy", spoken: "Follow Cons and Coins, and at out rich guy!"}
    hi: {caption: "Follow karo Cons & Coins aur @outrichguy", spoken: "Cons and Coins aur at out rich guy ko follow karo!"}

# ------------------------------------------------------------
#  SCHEDULE  — India time (24h), one language per video.
#  The Make run (every hour) keeps the next uploads ready; the Post run (every 30 min)
#  posts each slot's video at its time. Change any number here any time.
# ------------------------------------------------------------
schedule:
  every_minutes: 60          # one upload every 60 min = 24 a day (120 = 12 a day, 240 = 6, 1440 = 1)
  first: "00:30"             # time of the first upload of the day; the rest follow every_minutes
  language: en               # every upload is in this language...
  language_at: {"09:30": hi} # ...except these upload times (add more: {"09:30": hi, "21:30": hi})
  make_ahead: 2              # keep the next 2 uploads ready (raise it if posts ever go out late)
  make_per_run: 1            # each hourly Make run makes at most this many videos

# ------------------------------------------------------------
#  LANGUAGES  — every video is in exactly ONE language.
# ------------------------------------------------------------
languages:
  enabled: [en, hi]
  en:
    name: English
    prompt: prompts/lang_en.md
    tts_lang: en-us
    voice: am_michael       # Kokoro voice (fallback). Others: am_adam, am_onyx, bm_george
    edge_voice: en-US-AndrewNeural   # edge-tts voice (primary). Others: en-US-GuyNeural, en-US-ChristopherNeural
    edge_rate: "+0%"         # calm pace (~160-170 wpm). Faster: "+10%". Check "Speaking pace" in the run log
    speed: 0.95             # Kokoro (fallback voice)
    words_per_second: 2.7   # sets the script length (target_seconds x this)
  hi:
    name: Hindi (natural Hinglish)
    prompt: prompts/lang_hi.md
    tts_lang: hi
    voice: hm_omega         # Kokoro (fallback): hm_omega, hm_psi (male), hf_alpha, hf_beta (female)
    edge_voice: hi-IN-MadhurNeural   # edge-tts (primary): hi-IN-MadhurNeural (male) or hi-IN-SwaraNeural (female)
    edge_rate: "+0%"
    speed: 0.95
    words_per_second: 2.5

# ------------------------------------------------------------
#  THEMES  — explainers stay the majority; the rest are experiments.
#  `share` is the target fraction of videos. Set share: 0 to switch a theme off.
# ------------------------------------------------------------
themes:
  explainer:
    share: 0.8
    guidance: >-
      A clear answer to one specific, surprising question from the topic menu, told as a tiny story
      (2nd person "Imagine you..." or one ordinary person): how money really works, psychology,
      business, weird history. Real explanation, verified facts, one satisfying "oh, THAT's why" payoff.
  story:
    share: 0.2
    guidance: >-
      A true story in the kit formula: someone does something that looks stupid, people laugh, it gets
      worse, he was right all along, the ones who laughed pay for it. A con or scam, a business rise and
      fall, a heist, a strange historical event, an unlikely invention. Still teaches one real thing.

ideas:
  candidates: 8               # ideas Claude brainstorms per video before one is picked
  similarity_threshold: 0.5   # 0-1: higher = allow more similar ideas
  dedupe_across_languages: true

voice:
  engine: edge            # edge = Microsoft edge-tts with real word timings (falls back to Kokoro by itself)
                          # kokoro = always Kokoro. Test-mode runs always use Kokoro (offline).
  edge_retries: 6         # tries per line (backing off 3-40 s) before the whole video switches to Kokoro
  edge_pause: 1.5         # seconds between lines: Microsoft throttles fast requests ("No audio was received")
  gap_seconds: 0.2        # short pause between sentences (each line is one sentence)

# Which Claude writes ideas and scripts (Claude Code CLI, your subscription).
claude:
  model: sonnet               # pinned: never depend on the account's default model (opus = best scripts, ~3-5x the tokens)
  fallback_model: opus        # used automatically if Sonnet is overloaded
  effort: medium              # high = more thinking tokens per script

claude_fallback_to_free: true   # Claude out of usage / down -> the same prompts go to FreeLLMAPI's free models

# The video engine: the animated-shorts-kit head skill (.claude/skills/animated-shorts-kit), see references/08_OUR_PIPELINE.md.
studio:
  director: claude          # who writes + repairs the shot plan: claude (best, ~10k tokens a call) or freellm (free)
  claude_model: sonnet      # Claude director (sonnet = cheap + good, opus = best)
  claude_effort: medium     # low / medium / high thinking for the director (higher = more tokens)
  repair_rounds: 3          # rounds of remaining problems sent back to the director
  autofix_rounds: 24        # before any model is asked: code retries failing camera keys / moves people (free, ~10 s each)
  waive_max: 2              # gate glitches this short (checked frames, ~2 frames each) are waived the kit's way, with a reason
  rescue: true              # when the director can't pass the checks, rescue_model takes over before 2D
  rescue_model: opus
  rescue_rounds: 2
  judge: true               # scores the preview's contact sheets (10_JUDGE.md) with a FreeLLMAPI vision model (free)
  claude_judge: false       # true = Claude judges when FreeLLMAPI is not running (reads 8 images: many tokens)
  good_enough: 8            # judge overall score (1-10) at which the fix round is skipped
  music_db: -13             # music bed vs voice (kit: 10-15 dB under the voice, never stops)
  sfx_db: -10               # sound effects vs voice (peaks capped under the voice)
  render_timeout_minutes: 60   # one render; the whole Make job stops at 120 min

# FreeLLMAPI: started inside each GitHub job from the FREELLMAPI_KEYS secret (see FREELLM_SETUP.md).
# It judges the Shorts (and directs them when studio.director is freellm); Claude writes the idea, script and shot plan.
freellm:
  models: ["auto:smart", "auto"]   # tried in order. auto:smart = the most capable model that is ready right now, with
                              # failover; auto = any ready model, used only when every smart one failed.
                              # Put exact model ids first to pin favourites, e.g. ["gemini-2.5-pro", "auto:smart"].
  temperature: 0.5
  max_tokens: 12000
  timeout_seconds: 300
  max_calls_per_video: 24     # hard cap on requests for one video (repairs + judge + Claude fallback included)
  monthly_token_cap: 30000000 # once this month's total (data/freellm_usage.json) passes this, FreeLLMAPI is not used

# EMERGENCY ONLY: when the kit build fails, that Short is drawn by the old flat 2D engine (toon2d/).
toon2d:
  model: sonnet             # storyboard writer: one short text-only call per video (no code, no tools)
  effort: medium
  story_attempts: 2         # Claude attempts (2nd one gets the plan-check problems); then the auto storyboard
  captions: true            # burned-in word captions on Shorts
  calm: true                # steady pacing: no whip pans, no camera shakes
  music_db: -20             # music bed vs voice (quiet: the voice always wins)
  sfx_db: -13               # sound effects vs voice
  resolution: 1080          # 1080 or 720 (720 renders ~2x faster)
  timeout_minutes: 40

# ------------------------------------------------------------
#  AI DISCLOSURE  (decided from the real content, see README)
#  YouTube requires the "altered or synthetic" flag only for REALISTIC content;
#  clearly animated/stylised content is exempt. Meta asks for disclosure of
#  photorealistic video OR realistic-sounding audio, and our narrator is a
#  realistic synthetic voice, so the Instagram AI label stays on.
# ------------------------------------------------------------
disclosure:
  youtube_synthetic: false        # stylised cartoon = not realistic, so no YouTube flag
  instagram_ai_label: true

publish:
  instagram: true
  instagram_max_attempts: 2   # then you get a "post it by hand" notice and the queue moves on
  # youtube_mode:
  #   manual = bot sends you a GitHub notification with the file + title to upload
  #   api    = fully automatic (only after Google approves your API audit)
  #   off    = skip YouTube
  youtube_mode: api
  youtube_max_attempts: 2
  # YouTube safety controller (pipeline/yt_guard.py). uploadLimitExceeded is never retried: YouTube pauses >= 24 h.
  youtube_channel_daily_cap: 10          # successful uploads per ROLLING 24 h. Chosen from history: ~14 uploads succeeded in 24 h before two refused attempts on 26 Nov; raise only after a week without pauses.
  youtube_api_daily_insert_cap: 100     # videos.insert calls per Pacific-time day (Google's default allowance, Nov 2026)
  youtube_pause_hours: 24               # pause after uploadLimitExceeded (minimum 24)
  youtube_require_quota_clearance: true # after quotaExceeded, wait for the next Pacific quota day
  youtube_channel_id: ""                # optional UC... id: refuse uploads if the secrets point at another channel
  hashtags_max: 5
