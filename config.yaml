# ============================================================
#  SHORTS BOT SETTINGS  —  the only file you normally edit
# ============================================================

# Emergency stop. Set to true and nothing gets made or posted.
paused: false

channel:
  # What the channel is about. Claude picks daily ideas inside this space.
  niche: >-
    Explore The World: curious explainers about the human body, the mind,
    everyday mysteries, science, technology and inventions, space and
    discoveries, history and geography. Curious, slightly dark, funny.

video:
  target_seconds: 35      # Claude aims for this length (30-45 works best)
  width: 1080
  height: 1920
  fps: 30

# ------------------------------------------------------------
#  LANGUAGES  — every video is in exactly ONE language.
#  The bot learns from views which language does better and makes more of it,
#  but never less than `allocation.floor` (20%) of either.
# ------------------------------------------------------------
languages:
  enabled: [en, hi]
  en:
    name: English
    prompt: prompts/lang_en.md
    tts_lang: en-us
    voice: am_michael       # Kokoro voice (fallback). Others: am_adam, am_onyx, bm_george
    edge_voice: en-US-AndrewNeural   # edge-tts voice (primary). Others: en-US-GuyNeural, en-US-ChristopherNeural
    edge_rate: "+10%"
    speed: 1.12
    words_per_second: 2.7   # Kokoro speaking rate at speed 1.0 (used for script length)
    caption_font: Anton
    caption_font_file: Anton-Regular.ttf
    caption_uppercase: true
    caption_font_size: 160
  hi:
    name: Hindi (natural Hinglish)
    prompt: prompts/lang_hi.md
    tts_lang: hi
    voice: hm_omega         # Kokoro (fallback): hm_omega, hm_psi (male), hf_alpha, hf_beta (female)
    edge_voice: hi-IN-MadhurNeural   # edge-tts (primary): hi-IN-MadhurNeural (male) or hi-IN-SwaraNeural (female)
    edge_rate: "+5%"
    speed: 1.05
    words_per_second: 2.5
    caption_font: Noto Sans Devanagari
    caption_font_file: NotoSansDevanagari-Bold.ttf
    caption_latin_font: Noto Sans        # English words inside Hindi lines
    caption_latin_font_file: NotoSans-Bold.ttf
    caption_uppercase: false
    caption_font_size: 140

allocation:
  floor: 0.2              # each language always gets at least 20% (so max 80% for the stronger one)
  min_videos: 4           # per language, before views are allowed to move the split
  min_age_days: 2         # ignore videos younger than this (views still coming in)
  window_days: 30         # only compare recent videos
  sensitivity: 1.5        # how hard performance pulls the split (higher = faster)
  smoothing: 0.35         # how much of the new target is applied per day (0-1)

# ------------------------------------------------------------
#  THEMES  — explainers stay the majority; the rest are experiments.
#  `share` is the target fraction of videos. Set share: 0 to switch a theme off.
# ------------------------------------------------------------
themes:
  explainer:
    share: 0.8
    render_style: explainer
    guidance: >-
      A clear answer to one specific, surprising question about the body, mind,
      nature, science, technology, space, history or geography. Real explanation,
      verified facts, one satisfying "oh, THAT's why" payoff.
  story:
    share: 0.13
    render_style: explainer
    guidance: >-
      A short narrated story with a twist, built on something real: a strange
      historical event, an unlikely invention, a survival story, a scientific
      accident. Clear beginning, tension, payoff. Still teaches one real thing.
  roblox_story:
    share: 0.07
    render_style: blocky    # remotion engine: drawn as a 3D toy world in code, no AI pictures
    guidance: >-
      A short dramatic or funny story told in a blocky game-world style
      (original characters). Story-time pacing, a twist ending. Do not use
      Roblox logos, official assets, real players' names or other creators'
      characters. Keep it suitable for teens.
    art_style: >-
      Stylized 3D render of a blocky toy-like game world, chunky low-poly
      characters with simple cube heads and cheerful expressions, bright
      saturated colors, soft studio lighting, playful camera angles
    mascot: >-
      an original blocky game avatar with a cube-shaped head, short spiky orange
      hair, big friendly eyes, teal hoodie and grey trousers

ideas:
  candidates: 8               # ideas Claude brainstorms per video before one is picked
  similarity_threshold: 0.5   # 0-1: higher = allow more similar ideas
  dedupe_across_languages: true

# ------------------------------------------------------------
#  VISUALS  <<< HIGGSFIELD SWAP SLOT >>>  change ONE word below.
#   cloudflare_klein  = FREE AI pictures, SAME character + style every scene (use this now)
#   cloudflare_flux   = older free mode (every picture separate)
#   higgsfield_test   = DEMO the Higgsfield motion pipeline with placeholder clips, no account
#   higgsfield_clips  = REAL Higgsfield motion clips + our voice/captions (when you have Higgsfield)
#   higgsfield_full   = Higgsfield makes the whole finished video
#   placeholder       = plain colour cards (used by the Test-mode button only)
# ------------------------------------------------------------
visuals:
  provider: cloudflare_klein
  # Default look for every picture. Stylised, NOT photoreal (see `disclosure` below).
  art_style: >-
    Stylized 3D animated educational cartoon, like a frame from a modern
    family animated film: smooth rounded shapes, slightly exaggerated
    proportions, vivid saturated colors, soft global illumination with rim
    light, clean simple background, clear silhouette, high detail
  # How each kind of shot is drawn (Claude picks a shot per scene).
  shots:
    character: "expressive cartoon character acting out the moment, readable pose and face"
    cutaway: "clean educational cutaway of the inside, cartoon anatomy or machinery, glowing highlights on the key part, non-graphic, simple dark gradient backdrop"
    diagram: "3D infographic-style illustration with simple shapes and arrows, no words, toy-like materials"
    metaphor: "playful visual metaphor that explains the idea, toy-like miniature world"
    closeup: "extreme close-up on the key object, shallow depth of field"
    wide: "wide establishing shot of the whole scene, small character in a big world"
  composition: >-
    vertical 9:16, main subject in the upper two-thirds of the frame, lower
    third kept simple and uncluttered
  avoid: "no text, no letters, no captions, no watermark, no logo, no split panels, not photorealistic, no real people"
  # Our own recurring character. Claude writes [GUY] and it becomes this.
  # The bot draws him once per art style and reuses the picture as a reference.
  mascot: >-
    a friendly cartoon young man with big expressive eyes, messy dark-brown
    hair, round face, mustard-yellow hoodie and dark jeans
  flux_steps: 8           # only used by cloudflare_flux
  min_scenes_ok: 0.75     # if a few pictures fail, re-use neighbours; below this share, stop

voice:
  engine: edge            # edge = Microsoft edge-tts with real word timings (falls back to Kokoro by itself)
                          # kokoro = always Kokoro. Test-mode runs always use Kokoro (offline).
  edge_retries: 3         # tries per line before the whole video switches to Kokoro
  gap_seconds: 0.08       # pause between lines

# How the finished video is drawn.
#   remotion = code-made motion graphics (remotion/ folder): camera moves, remocn transitions,
#              word-pop captions, stickers, impact bursts; blocky themes are drawn in 3D code
#   ffmpeg   = the older Python renderer (pictures + pan/zoom + burned-in captions)
render:
  engine: remotion
  caption_style: word_pop   # word_pop | karaoke | highlight_box | bounce_in | active_pop | outline | stamp
  concurrency: 2            # GitHub's free runners have 2 CPU cores
  timeout_minutes: 25

captions:
  words_per_chunk: 2
  color: "FFFFFF"         # normal words (hex RGB)
  highlight: "FFE600"     # keyword colour (hex RGB)
  position_from_bottom: 460   # lower third, above the Shorts/Reels buttons and title
  max_width: 900              # px; long chunks shrink to fit

audio:
  music_volume_db: -22    # background music under the voice
  sfx_volume_db: -8
  caption_pops: true      # tiny pop sound on each caption

# ------------------------------------------------------------
#  AI DISCLOSURE  (decided from the real content, see README)
#  YouTube requires the "altered or synthetic" flag only for REALISTIC content;
#  clearly animated/stylised content is exempt. Meta asks for disclosure of
#  photorealistic video OR realistic-sounding audio, and our narrator is a
#  realistic synthetic voice, so the Instagram AI label stays on.
# ------------------------------------------------------------
disclosure:
  photorealistic_visuals: false   # set true if you switch to realistic footage/pictures
  youtube_synthetic: auto         # auto = follow photorealistic_visuals; or true / false
  instagram_ai_label: true

publish:
  post_time_ist: "19:00"  # info only — real time is set in .github/workflows/post-video.yml
  instagram: true
  instagram_max_attempts: 2   # then you get a "post it by hand" notice and the queue moves on
  # youtube_mode:
  #   manual = bot sends you a GitHub notification with the file + title to upload
  #   api    = fully automatic (only after Google approves your API audit)
  #   off    = skip YouTube
  youtube_mode: api
  youtube_max_attempts: 2
  hashtags_max: 5

# How many finished videos to keep ready as backup (protects against a bad day).
buffer: 2
