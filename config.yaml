# ============================================================
#  SHORTS BOT SETTINGS  —  the only file you normally edit
# ============================================================

# Emergency stop. Set to true and nothing gets made or posted.
paused: false

channel:
  # What the channel is about. Claude picks daily ideas inside this space.
  # Topic menu (ReachMora idea strategy: high-earning, bingeable niches with drawable cause and effect).
  # Claude mixes these across its pitches. Delete a line to drop that niche.
  niche: |-
    Cons & Coins: scams, heists, money and the psychology behind them, as curious, slightly dark, funny cartoon stories and explainers.
    - Money stories, scams and cons (rise, trick, twist)
    - Business rise and fall (one decision that made or broke a company)
    - Psychology and human behaviour (why people do strange things)
    - Self-improvement and life lessons (one habit or rule, shown in a story)
    - How money really works (inflation, banks, debt, prices, explained simply)
    - Weird history and mysteries (strange events, odd laws, lucky accidents)
    - Light true crime (heists, frauds, escapes; nothing graphic)

video:                    # vertical 1080x1920
  style: cartoon3d        # cartoon3d = Claude builds a 2D-cards-in-3D world per Short (falls back to toon2d)
                          # toon2d    = flat 2D cartoon from one small storyboard (far fewer tokens)
  target_seconds: 35      # Claude aims for this length (30-45 works best)
  fps: 30

# ------------------------------------------------------------
#  LANGUAGES  — every video is in exactly ONE language.
#  The bot learns from views which language does better and makes more of it,
#  but never less than `allocation.floor` (20%) of either.
# ------------------------------------------------------------
languages:
  enabled: [en, hi]
  en:
    name: English
    prompt: prompts/lang_en.md
    tts_lang: en-us
    voice: am_michael       # Kokoro voice (fallback). Others: am_adam, am_onyx, bm_george
    edge_voice: en-US-AndrewNeural   # edge-tts voice (primary). Others: en-US-GuyNeural, en-US-ChristopherNeural
    edge_rate: "+0%"         # Shorts pace, target 160-180 wpm: check "Speaking pace" in the run log
    speed: 0.95             # Kokoro: ~184 wpm while speaking, ~171 with the pauses
    words_per_second: 2.7   # Kokoro speaking rate at speed 1.0 (used for script length)
  hi:
    name: Hindi (natural Hinglish)
    prompt: prompts/lang_hi.md
    tts_lang: hi
    voice: hm_omega         # Kokoro (fallback): hm_omega, hm_psi (male), hf_alpha, hf_beta (female)
    edge_voice: hi-IN-MadhurNeural   # edge-tts (primary): hi-IN-MadhurNeural (male) or hi-IN-SwaraNeural (female)
    edge_rate: "+0%"
    speed: 0.95
    words_per_second: 2.5

allocation:
  # weekly = fixed plan: `main` language every day, plus `weekly_quota` videos per Mon-Sun week
  #          (from `quota_day` on). adaptive = split learned from views (settings below).
  mode: weekly
  main: en
  weekly_quota:
    hi: 1
  quota_day: wed
  # --- adaptive mode only ---
  floor: 0.2              # each language always gets at least 20% (so max 80% for the stronger one)
  min_videos: 4           # per language, before views are allowed to move the split
  min_age_days: 2         # ignore videos younger than this (views still coming in)
  window_days: 30         # only compare recent videos
  sensitivity: 1.5        # how hard performance pulls the split (higher = faster)
  smoothing: 0.35         # how much of the new target is applied per day (0-1)

# ------------------------------------------------------------
#  THEMES  — explainers stay the majority; the rest are experiments.
#  `share` is the target fraction of videos. Set share: 0 to switch a theme off.
# ------------------------------------------------------------
themes:
  explainer:
    share: 0.8
    guidance: >-
      A clear answer to one specific, surprising question from the topic menu
      (how money really works, psychology, self-improvement, business, weird
      history...). Formats: explainer, list or versus. Real explanation,
      verified facts, one satisfying "oh, THAT's why" payoff.
  story:
    share: 0.13
    guidance: >-
      A short narrated story with a twist, built on something real: a con or
      scam, a business rise and fall, a heist or escape, a strange historical
      event, an unlikely invention. Clear beginning, tension, payoff. Still
      teaches one real thing.
  roblox_story:
    share: 0.07
    guidance: >-
      A short dramatic or funny story set in a blocky game world (original
      characters). Story-time pacing, a twist ending. Do not use Roblox logos,
      official assets, real players' names or other creators' characters.
      Keep it suitable for teens.

ideas:
  candidates: 8               # ideas Claude brainstorms per video before one is picked
  similarity_threshold: 0.5   # 0-1: higher = allow more similar ideas
  dedupe_across_languages: true

voice:
  engine: edge            # edge = Microsoft edge-tts with real word timings (falls back to Kokoro by itself)
                          # kokoro = always Kokoro. Test-mode runs always use Kokoro (offline).
  edge_retries: 3         # tries per line before the whole video switches to Kokoro
  gap_seconds: 0.2        # short pause between sentences (each line is one sentence)

# Which Claude writes ideas and scripts (Claude Code CLI, your subscription).
claude:
  model: opus                 # pinned: never depend on the account's default model
  fallback_model: sonnet      # used automatically if Opus is overloaded
  effort: high

# Mixed 3D + 2D Shorts (.claude/skills/cartoon-audio-short). The run log prints "Claude usage: ..." per call;
# compare /usage in Claude Code before and after a run to see the share of your weekly limit.
cartoon3d:
  model: opus
  effort: high
  max_turns: 50
  claude_timeout_minutes: 60
  render_timeout_minutes: 150   # CPU WebGL, ~4 s per frame: a 35 s Short is ~30-60 min on GitHub

# How videos are drawn: the 2D ink cartoon engine (toon2d/, adapted from ReachMora 2D Long-Form).
toon2d:
  model: sonnet             # storyboard writer: one short text-only call per video (no code, no tools)
  effort: medium
  story_attempts: 2         # Claude attempts (2nd one gets the plan-check problems); then the auto storyboard
  captions: true            # burned-in word captions on Shorts
  long_captions: false      # and on the weekly long video
  calm: true                # steady pacing: no whip pans, no camera shakes
  music_db: -20             # music bed vs voice (quiet: the voice always wins)
  sfx_db: -13               # sound effects vs voice
  resolution: 1080          # 1080 or 720 (720 renders ~2x faster)
  timeout_minutes: 40

longform:                   # weekly English long video, 16:9, YouTube only (.github/workflows/long-video.yml)
  enabled: true
  minutes: 5                # 3-15; ~150 spoken words a minute
  model: opus               # writes + fact-checks the long script (one call, web search on)
  effort: high
  max_turns: 30
  privacy: private          # check the first ones in YouTube Studio, then set to public

# ------------------------------------------------------------
#  AI DISCLOSURE  (decided from the real content, see README)
#  YouTube requires the "altered or synthetic" flag only for REALISTIC content;
#  clearly animated/stylised content is exempt. Meta asks for disclosure of
#  photorealistic video OR realistic-sounding audio, and our narrator is a
#  realistic synthetic voice, so the Instagram AI label stays on.
# ------------------------------------------------------------
disclosure:
  youtube_synthetic: false        # 2D cartoon = not realistic, so no YouTube flag
  instagram_ai_label: true

publish:
  post_time_ist: "19:00"  # info only — real time is set in .github/workflows/post-video.yml
  instagram: true
  instagram_max_attempts: 2   # then you get a "post it by hand" notice and the queue moves on
  # youtube_mode:
  #   manual = bot sends you a GitHub notification with the file + title to upload
  #   api    = fully automatic (only after Google approves your API audit)
  #   off    = skip YouTube
  youtube_mode: api
  youtube_max_attempts: 2
  hashtags_max: 5

# How many finished videos to keep ready as backup (protects against a bad day).
buffer: 1   # ready Shorts to keep: 1 = the daily run makes one (each 3D Short costs a lot of tokens)
